[tool.pytest.ini_options]
addopts = "--ignore=plugin/vendor"
markers = [
    "integration: mark a test as an integration test."
]

[tool.mypy]
exclude = "^plugin/vendor/|scripts/|tests/"
strict = true
python_version = "3.13"

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["plugin/vendor", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "UP"]
ignore = ["UP045"]
