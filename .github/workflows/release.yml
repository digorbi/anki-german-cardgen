name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event.base_ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Read Python version
        id: pyver
        run: echo "version=$(cat .python-version)" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run linter
        run: ruff check .
      - name: Run type checks
        run: mypy .
      - name: Run tests
        run: pytest --disable-warnings

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Read Python version
        id: pyver
        run: echo "version=$(cat .python-version)" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ steps.pyver.outputs.version }}
      - name: Bundle dependencies
        run: python scripts/bundle.py
      - name: Create build archive
        run: |
          mkdir -p build/anki-german-cardgen
          cp -r plugin/* core prompts templates build/anki-german-cardgen/
          cd build
          zip -r anki-german-cardgen-${{ github.ref_name }}.zip anki-german-cardgen
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-build
          path: build/anki-german-cardgen-${{ github.ref_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: addon-build
          path: ./build/

      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Publish GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "anki-german-cardgen ${{ github.ref_name }}" \
            ./build/anki-german-cardgen-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
